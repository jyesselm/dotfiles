# Dashboard tiles. Links use LINK_HOST from .env (the Tailscale name, so they work away from home); widgets call each service from inside the container network.
# {{HOMEPAGE_VAR_*}} values come from ../.env, so this file holds no secrets.
- Watch:
    - Plex:
        icon: plex.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:32400/web
        siteMonitor: http://{{HOMEPAGE_VAR_HOST_ADDR}}:32400/identity
        description: Streaming
        widget:
          type: plex
          url: http://{{HOMEPAGE_VAR_HOST_ADDR}}:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
    - Seerr:
        icon: overseerr.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:5055
        siteMonitor: http://seerr:5055
        description: Requests
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
    - Audiobookshelf:
        icon: audiobookshelf.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:13378
        siteMonitor: http://audiobookshelf:80/healthcheck
        description: Audiobooks and podcasts
        widget:
          type: audiobookshelf
          url: http://audiobookshelf:80
          key: "{{HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY}}"
    - AudioBookRequest:
        icon: mdi-book-plus
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:8000
        siteMonitor: http://audiobookrequest:8000
        description: Audiobook requests
    - RomM:
        icon: romm.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:8090
        siteMonitor: http://romm:8080/api/heartbeat
        description: Retro games, play in the browser
    - PairDrop:
        icon: pairdrop.png
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:3010
        siteMonitor: http://pairdrop:3000
        description: Drop files between devices

- Automation:
    - Media Index:
        icon: mdi-harddisk
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:8686
        siteMonitor: http://media-index:8686/api/summary
        description: Disk use, keep/delete/shrink review
        widget:
          type: customapi
          url: http://media-index:8686/api/summary
          mappings:
            - field: {decided: {undecided: items}}
              label: To review
              format: number
            - field: {decided: {delete: size}}
              label: Marked delete
              format: bytes
            - field: shrinkable
              label: Can shrink
              format: bytes
    - Gamarr:
        icon: mdi-gamepad-variant
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:5001
        siteMonitor: http://gamarr:5001/api/health
        description: Games, files ROMs for RomM
    - Radarr:
        icon: radarr.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:7878
        siteMonitor: http://radarr:7878/ping
        description: Movies
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          enableQueue: true
    - Sonarr:
        icon: sonarr.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:8989
        siteMonitor: http://sonarr:8989/ping
        description: TV
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          enableQueue: true
    - Lidarr:
        icon: lidarr.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:8687
        siteMonitor: http://lidarr:8686/ping
        description: Music
        widget:
          type: lidarr
          url: http://lidarr:8686
          key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"
    - spotDL:
        icon: mdi-music-note-plus
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:8800
        siteMonitor: http://spotdl:8800
        description: Single songs from a Spotify link
    - Sonobarr:
        icon: mdi-music-circle-outline
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:8688
        siteMonitor: http://sonobarr:5000
        description: Music discovery
    - Prowlarr:
        icon: prowlarr.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:9696
        siteMonitor: http://prowlarr:9696/ping
        description: Indexers
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

    - FlareSolverr:
        icon: flaresolverr.svg
        siteMonitor: http://flaresolverr:8191
        description: Cloudflare helper for Prowlarr

- Downloads:
    - qBittorrent:
        icon: qbittorrent.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:8080
        siteMonitor: http://gluetun:8080
        description: Torrents, only through the VPN
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: ""
          password: ""
    - VPN:
        icon: gluetun.svg
        description: NordVPN exit for qBittorrent
        widget:
          type: gluetun
          url: http://gluetun:8000
    - Uptime Kuma:
        icon: uptime-kuma.svg
        href: http://{{HOMEPAGE_VAR_LINK_HOST}}:3001
        siteMonitor: http://uptime-kuma:3001
        description: Up/down history and alerts

- Lab:
    - NAS portal:
        icon: mdi-nas
        href: http://yesselmanbackup:8765
        siteMonitor: http://100.88.15.86:8765/status.json
        description: Yesselman Backup · status, storage, trash
        widget:
          type: customapi
          url: http://100.88.15.86:8765/status.json
          refreshInterval: 60000
          mappings:
            - field: {summary: volume1_pct}
              label: Volume 1
              suffix: "%"
            - field: {summary: volume2_pct}
              label: Volume 2
              suffix: "%"
            - field: {summary: raid}
              label: RAID
            - field: {summary: disk_max_temp_c}
              label: Hottest drive
              suffix: " °C"
    - Data Index:
        icon: mdi-database-search
        href: http://100.73.70.25:8768
        siteMonitor: http://100.73.70.25:8768/api/summary
        description: Studio, backup disks, cloud, NAS, swan · what exists nowhere else
        widget:
          type: customapi
          url: http://100.73.70.25:8768/api/summary
          refreshInterval: 60000
          mappings:
            - field: indexed_bytes
              label: Indexed
              format: bytes
            - field: not_backed_up_bytes
              label: Nowhere else
              format: bytes
            - field: undecided_items
              label: To review
              format: number
            - field: delete_bytes
              label: Marked delete
              format: bytes
