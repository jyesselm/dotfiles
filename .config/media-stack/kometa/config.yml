# Kometa: Plex collections and poster badges (copied to /config/config.yml at each start, see compose.yml).
# Secrets come from KOMETA_<NAME> env vars as <<name>> (compose.yml): plexurl, plextoken, tmdbkey.
# Badges are resolution/HDR only; no rating badges. Defaults: https://kometa.wiki/en/latest/defaults/guide/

libraries:
  Movies:
    collection_files:
      - default: basic      # Newly Released, New Episodes
      - default: imdb       # IMDb Top 250, Popular
      - default: franchise  # Alien, Bond, Star Wars ...
      - default: universe   # MCU, DCEU, Wizarding World ...
    overlay_files:
      - default: resolution # 4K / 1080p plus HDR / Dolby Vision
  TV:
    collection_files:
      - default: basic
      - default: imdb
      - default: network
    overlay_files:
      - default: resolution
  Anime:
    collection_files:
      - default: basic
    overlay_files:
      - default: resolution

settings:
  asset_directory: []
  run_order: [operations, metadata, collections, overlays]

plex:
  url: <<plexurl>>
  token: <<plextoken>>
  timeout: 60
  clean_bundles: false
  empty_trash: false
  optimize: false

tmdb:
  apikey: <<tmdbkey>>
  language: en
