# Plex server media stack. See README.md here for setup, updates and moving to Linux.
# Machine-specific values and API keys live in the untracked .env next to this file (template: env.example).
# The media disk is always mounted at /Volumes/Plex_Disk_4 inside containers, whatever its host path,
# so the paths Radarr/Sonarr have stored keep working on a new machine.
# Up/update: docker-compose -f ~/.config/media-stack/compose.yml pull && docker-compose -f ~/.config/media-stack/compose.yml up -d
x-common: &common
  restart: unless-stopped
  environment:
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}

services:
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports: ["7878:7878"]
    volumes:
      - ${DATA_ROOT}/radarr/config:/config
      - ${MEDIA_ROOT}:/Volumes/Plex_Disk_4

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports: ["8989:8989"]
    volumes:
      - ${DATA_ROOT}/sonarr/config:/config
      - ${MEDIA_ROOT}:/Volumes/Plex_Disk_4

  lidarr:
    <<: *common
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    ports: ["8687:8686"]
    volumes:
      - ${DATA_ROOT}/lidarr/config:/config
      - ${MEDIA_ROOT}:/Volumes/Plex_Disk_4

  # Single songs: paste a Spotify song/album/playlist link; audio comes from YouTube Music, tags from Spotify,
  # saved as music/<Artist>/<Album>/<Song>.mp3 for Plex. For whole albums in better quality, use Lidarr.
  spotdl:
    build: ./spotdl
    container_name: spotdl
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports: ["8800:8800"]
    environment:
      HOME: /config
    command: >-
      web --host 0.0.0.0 --port 8800 --keep-alive --web-use-output-dir --allowed-origins "*"
      --format mp3 --bitrate auto --overwrite skip
      --output "/Volumes/Plex_Disk_4/music/{album-artist}/{album}/{title}.{output-ext}"
    volumes:
      - ${DATA_ROOT}/spotdl:/config
      - ${MEDIA_ROOT}:/Volumes/Plex_Disk_4

  # Music discovery: Last.fm artists similar to the ones in Lidarr; one click adds an artist to Lidarr.
  # Host port 8688 because macOS's AirPlay Receiver holds 5000. Login: admin + SONOBARR_ADMIN_PASSWORD.
  sonobarr:
    image: ghcr.io/dodelidoo-labs/sonobarr:latest
    container_name: sonobarr
    restart: unless-stopped
    ports: ["8688:5000"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      secret_key: ${SONOBARR_SECRET_KEY}
      lidarr_address: http://lidarr:8686
      lidarr_api_key: ${HOMEPAGE_VAR_LIDARR_KEY}
      root_folder_path: /Volumes/Plex_Disk_4/music/
      quality_profile_id: 3   # Standard, like the existing artists
      metadata_profile_id: 1  # Standard
      last_fm_api_key: ${LASTFM_API_KEY}
      last_fm_api_secret: ${LASTFM_API_SECRET}
      sonobarr_superadmin_username: admin
      sonobarr_superadmin_password: ${SONOBARR_ADMIN_PASSWORD}
    volumes:
      - ${DATA_ROOT}/sonobarr/config:/sonobarr/config

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports: ["9696:9696"]
    volumes:
      - ${DATA_ROOT}/prowlarr/config:/config

  # Cloudflare challenge helper, reached by Prowlarr over the stack network.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    expose: ["8191"]

  # NordVPN tunnel. qBittorrent shares this container's network, so it has no internet unless the tunnel is up.
  # Its web UI port is published here, not on qbittorrent.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    ports: ["8080:8080"]
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${NORDVPN_WIREGUARD_KEY}
      SERVER_COUNTRIES: ${VPN_COUNTRIES}
      # Let the other containers reach qBittorrent's web UI through the tunnel's firewall.
      FIREWALL_OUTBOUND_SUBNETS: 172.30.0.0/24
    volumes:
      - ./gluetun-auth.toml:/gluetun/auth/config.toml:ro

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on: [gluetun]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: "8080"
    volumes:
      - ${DATA_ROOT}/qbittorrent/config:/config
      - ${MEDIA_ROOT}:/Volumes/Plex_Disk_4

  # Request app (formerly Jellyseerr/Overseerr). Runs as uid 1000 inside the container.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    ports: ["5055:5055"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/seerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  # Audiobooks with per-user progress; iPhone apps. Accounts and libraries are set up in its web UI.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports: ["13378:80"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/audiobookshelf/config:/config
      - ${DATA_ROOT}/audiobookshelf/metadata:/metadata
      - ${MEDIA_ROOT}:/Volumes/Plex_Disk_4

  # Retro game library with in-browser play (EmulatorJS) and per-user saves. ROMs live in
  # Plex_Disk_4/Games/roms/<platform>/ (folder names: docs.romm.app → Supported Platforms). Accounts are made in its web UI.
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    ports: ["8090:8080"]
    environment:
      TZ: ${TZ}
      DB_HOST: romm-db
      DB_NAME: romm
      DB_USER: romm-user
      DB_PASSWD: ${ROMM_DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
      # Keyless metadata sources; IGDB and ScreenScraper add more when their keys are set in .env.
      HASHEOUS_API_ENABLED: "true"
      LAUNCHBOX_API_ENABLED: "true"
      PLAYMATCH_API_ENABLED: "true"
      HLTB_API_ENABLED: "true"
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      SCREENSCRAPER_USER: ${SCREENSCRAPER_USER:-}
      SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD:-}
    volumes:
      - ${MEDIA_ROOT}/Games:/romm/library
      - ${DATA_ROOT}/romm/resources:/romm/resources
      - ${DATA_ROOT}/romm/assets:/romm/assets
      - ${DATA_ROOT}/romm/config:/romm/config
      - ${DATA_ROOT}/romm/redis:/redis-data
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true

  # Game/ROM search and download (the *arr for games): searches Prowlarr's game indexers, downloads via qBittorrent,
  # hardlinks ROMs into Games/roms/<platform>/ for RomM. The disk is mounted at the same path as in qBittorrent
  # because Gamarr has no remote path mapping.
  gamarr:
    image: ghcr.io/jeremiahm37/gamarr:latest
    container_name: gamarr
    restart: unless-stopped
    ports: ["5001:5001"]
    environment:
      TZ: ${TZ}
      DATA_DIR: /data
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${HOMEPAGE_VAR_PROWLARR_KEY}
      QB_URL: http://gluetun:8080
      QB_CATEGORY: games
      QB_SAVE_PATH: /Volumes/Plex_Disk_4/downloading/games
      GAMES_ROMS_PATH: /Volumes/Plex_Disk_4/Games/roms
      GAMES_VAULT_PATH: /Volumes/Plex_Disk_4/Games/pc
      IMPORT_MODE: hardlink
      ROMM_URL: http://romm:8080
    volumes:
      - ${DATA_ROOT}/gamarr:/data
      - ${MEDIA_ROOT}:/Volumes/Plex_Disk_4

  romm-db:
    image: mariadb:11
    container_name: romm-db
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MARIADB_ROOT_PASSWORD: ${ROMM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm-user
      MARIADB_PASSWORD: ${ROMM_DB_PASSWORD}
    volumes:
      - ${DATA_ROOT}/romm/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  # Media index: what's using the disk, Plex watch history, keep/delete/shrink review. See media-index/.
  # "Delete" only moves items into Plex_Disk_4/_trash (emptied by hand) and unmonitors them in Radarr/Sonarr.
  media-index:
    build: ./media-index
    container_name: media-index
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports: ["8686:8686"]
    environment:
      TZ: ${TZ}
      RADARR_KEY: ${HOMEPAGE_VAR_RADARR_KEY}
      SONARR_KEY: ${HOMEPAGE_VAR_SONARR_KEY}
    volumes:
      - ${DATA_ROOT}/media-index:/data
      - ${MEDIA_ROOT}:/Volumes/Plex_Disk_4
      - ${PLEX_DB_DIR}:/plex-db:ro

  # Dashboard: one tile per service with live stats. Config (no secrets) is tracked in ./homepage.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports: ["3000:3000"]
    env_file: .env
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      HOMEPAGE_VAR_HOST_ADDR: ${HOST_ADDR}
    volumes:
      - ./homepage:/app/config
      - ${MEDIA_ROOT}:/Volumes/Plex_Disk_4:ro

  # Up/down checks with history and phone alerts.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports: ["3001:3001"]
    volumes:
      - ${DATA_ROOT}/uptime-kuma:/app/data

# Fixed subnet so qBittorrent's "no login from the stack" rule and gluetun's firewall rule work on any machine.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
