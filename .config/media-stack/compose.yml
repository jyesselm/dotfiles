# Plex server media stack. See README.md here for setup, updates and moving to Linux.
# Machine-specific values and API keys live in the untracked .env next to this file (template: env.example).
# The media disk is always mounted at /Volumes/plex-media inside containers, whatever its host path,
# so the paths Radarr/Sonarr have stored keep working on a new machine.
# Up/update: docker-compose -f ~/.config/media-stack/compose.yml pull && docker-compose -f ~/.config/media-stack/compose.yml up -d
x-common: &common
  restart: unless-stopped
  environment:
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}

services:
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports: ["7878:7878"]
    volumes:
      - ${DATA_ROOT}/radarr/config:/config
      - ${MEDIA_ROOT}:/Volumes/plex-media

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports: ["8989:8989"]
    volumes:
      - ${DATA_ROOT}/sonarr/config:/config
      - ${MEDIA_ROOT}:/Volumes/plex-media

  # English subtitles for foreign-language movies and shows from Radarr/Sonarr (saved as .en.srt next to the video).
  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports: ["6767:6767"]
    volumes:
      - ${DATA_ROOT}/bazarr/config:/config
      - ${MEDIA_ROOT}:/Volumes/plex-media

  lidarr:
    <<: *common
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    ports: ["8687:8686"]
    volumes:
      - ${DATA_ROOT}/lidarr/config:/config
      - ${MEDIA_ROOT}:/Volumes/plex-media

  # Single songs: paste a Spotify song/album/playlist link; audio comes from YouTube Music, tags from Spotify,
  # saved as music/<Artist>/<Album>/<Song>.mp3 for Plex. For whole albums in better quality, use Lidarr.
  spotdl:
    build: ./spotdl
    container_name: spotdl
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports: ["8800:8800"]
    environment:
      HOME: /config
    command: >-
      web --host 0.0.0.0 --port 8800 --keep-alive --web-use-output-dir --allowed-origins "*"
      --format mp3 --bitrate auto --overwrite skip
      --output "/Volumes/plex-media/music/{album-artist}/{album}/{title}.{output-ext}"
    volumes:
      - ${DATA_ROOT}/spotdl:/config
      - ${MEDIA_ROOT}:/Volumes/plex-media

  # Music discovery: Last.fm artists similar to the ones in Lidarr; one click adds an artist to Lidarr.
  # Host port 8688 because macOS's AirPlay Receiver holds 5000. Login: admin + SONOBARR_ADMIN_PASSWORD.
  sonobarr:
    image: ghcr.io/dodelidoo-labs/sonobarr:latest
    container_name: sonobarr
    restart: unless-stopped
    ports: ["8688:5000"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      secret_key: ${SONOBARR_SECRET_KEY}
      lidarr_address: http://lidarr:8686
      lidarr_api_key: ${HOMEPAGE_VAR_LIDARR_KEY}
      root_folder_path: /Volumes/plex-media/music/
      quality_profile_id: 3   # Standard, like the existing artists
      metadata_profile_id: 1  # Standard
      last_fm_api_key: ${LASTFM_API_KEY}
      last_fm_api_secret: ${LASTFM_API_SECRET}
      sonobarr_superadmin_username: admin
      sonobarr_superadmin_password: ${SONOBARR_ADMIN_PASSWORD}
    volumes:
      - ${DATA_ROOT}/sonobarr/config:/sonobarr/config

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports: ["9696:9696"]
    volumes:
      - ${DATA_ROOT}/prowlarr/config:/config

  # Cloudflare challenge helper, reached by Prowlarr over the stack network.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    expose: ["8191"]

  # NordVPN tunnel. qBittorrent shares this container's network, so it has no internet unless the tunnel is up.
  # Its web UI port is published here, not on qbittorrent.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    ports: ["8080:8080"]
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${NORDVPN_WIREGUARD_KEY}
      SERVER_COUNTRIES: ${VPN_COUNTRIES}
      # Let the other containers reach qBittorrent's web UI through the tunnel's firewall.
      FIREWALL_OUTBOUND_SUBNETS: 172.30.0.0/24
    volumes:
      - ./gluetun-auth.toml:/gluetun/auth/config.toml:ro

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on: [gluetun]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: "8080"
    volumes:
      - ${DATA_ROOT}/qbittorrent/config:/config
      - ${MEDIA_ROOT}:/Volumes/plex-media

  # Removes downloads that stay stalled, blocklists the release and has Radarr/Sonarr search for another.
  # Configured in its web UI: qBittorrent at http://gluetun:8080, Radarr, Sonarr; queue cleaner every 30 min, stall rule 12 strikes (6 h).
  cleanuparr:
    <<: *common
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    ports: ["11011:11011"]
    volumes:
      - ${DATA_ROOT}/cleanuparr/data:/config

  # Request app (formerly Jellyseerr/Overseerr). Runs as uid 1000 inside the container.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    ports: ["5055:5055"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/seerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  # Seerr for audiobooks: search Audible, request, and it grabs through Prowlarr's qBittorrent client (category
  # audiobooks, saved straight into the audiobooks folder).
  audiobookrequest:
    image: markbeep/audiobookrequest:1
    container_name: audiobookrequest
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/audiobookrequest/config:/config

  # Audiobooks with per-user progress; iPhone apps. Accounts and libraries are set up in its web UI.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports: ["13378:80"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/audiobookshelf/config:/config
      - ${DATA_ROOT}/audiobookshelf/metadata:/metadata
      - ${MEDIA_ROOT}:/Volumes/plex-media

  # Retro game library with in-browser play (EmulatorJS) and per-user saves. ROMs live in
  # plex-media/games/roms/<platform>/ (folder names: docs.romm.app → Supported Platforms). Accounts are made in its web UI.
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    ports: ["8090:8080"]
    environment:
      TZ: ${TZ}
      DB_HOST: romm-db
      DB_NAME: romm
      DB_USER: romm-user
      DB_PASSWD: ${ROMM_DB_PASSWORD}
      ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
      # Keyless metadata sources; IGDB and ScreenScraper add more when their keys are set in .env.
      HASHEOUS_API_ENABLED: "true"
      LAUNCHBOX_API_ENABLED: "true"
      PLAYMATCH_API_ENABLED: "true"
      HLTB_API_ENABLED: "true"
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      SCREENSCRAPER_USER: ${SCREENSCRAPER_USER:-}
      SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD:-}
    volumes:
      - ${MEDIA_ROOT}/games:/romm/library
      - ${DATA_ROOT}/romm/resources:/romm/resources
      - ${DATA_ROOT}/romm/assets:/romm/assets
      - ${DATA_ROOT}/romm/config:/romm/config
      - ${DATA_ROOT}/romm/redis:/redis-data
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true

  # Game/ROM search and download (the *arr for games): searches Prowlarr's game indexers, downloads via qBittorrent,
  # hardlinks ROMs into games/roms/<platform>/ for RomM. The disk is mounted at the same path as in qBittorrent
  # because Gamarr has no remote path mapping.
  gamarr:
    image: ghcr.io/jeremiahm37/gamarr:latest
    container_name: gamarr
    restart: unless-stopped
    ports: ["5001:5001"]
    environment:
      TZ: ${TZ}
      DATA_DIR: /data
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${HOMEPAGE_VAR_PROWLARR_KEY}
      QB_URL: http://gluetun:8080
      QB_CATEGORY: games
      QB_SAVE_PATH: /Volumes/plex-media/downloads/games
      GAMES_ROMS_PATH: /Volumes/plex-media/games/roms
      GAMES_VAULT_PATH: /Volumes/plex-media/games/pc
      IMPORT_MODE: hardlink
      ROMM_URL: http://romm:8080
    volumes:
      - ${DATA_ROOT}/gamarr:/data
      - ${MEDIA_ROOT}:/Volumes/plex-media

  romm-db:
    image: mariadb:11
    container_name: romm-db
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MARIADB_ROOT_PASSWORD: ${ROMM_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm-user
      MARIADB_PASSWORD: ${ROMM_DB_PASSWORD}
    volumes:
      - ${DATA_ROOT}/romm/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  # AirDrop-style file drop in the browser between any devices on the tailnet or LAN. Nothing is stored.
  pairdrop:
    <<: *common
    image: lscr.io/linuxserver/pairdrop:latest
    container_name: pairdrop
    ports: ["3010:3000"]

  # Media index: what's using the disk, Plex watch history, keep/delete/shrink review. See media-index/.
  # "Delete" only moves items into plex-media/_trash (emptied by hand) and unmonitors them in Radarr/Sonarr.
  media-index:
    build: ./media-index
    container_name: media-index
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports: ["8686:8686"]
    environment:
      TZ: ${TZ}
      RADARR_KEY: ${HOMEPAGE_VAR_RADARR_KEY}
      SONARR_KEY: ${HOMEPAGE_VAR_SONARR_KEY}
      DRIVE_CATALOG_DIR: /data/drives  # = ~/.local/share/media-index/drives, where drives.py keeps manifests
    volumes:
      - ${DATA_ROOT}/media-index:/data
      - ${MEDIA_ROOT}:/Volumes/plex-media
      - ${PLEX_DB_DIR}:/plex-db:ro

  # Plex ⇄ Trakt ratings and watched status (Trakt's own Plex Sync skips ratings). Syncs every 6 h; /init drops to
  # PUID/PGID. One-time login: docker-compose run --rm plextraktsync login (needs a Trakt API app, see README.md).
  plextraktsync:
    image: ghcr.io/taxel/plextraktsync:latest
    container_name: plextraktsync
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      PYTHONPATH: /patches  # sitecustomize.py: fixes rating URLs for Trakt usernames with "_"
    command: ["sh", "-c", "while :; do /init sync; sleep 21600; done"]
    volumes:
      - ${DATA_ROOT}/plextraktsync:/app/config
      - ./plextraktsync:/patches:ro

  # Home dashboard: library, downloads, storage, machines and service health on one page.
  # Own code in ./dashboard (standard library); reads every service's API, writes nothing.
  dashboard:
    build: ./dashboard
    container_name: dashboard
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      TZ: ${TZ}
      HOST_ADDR: ${HOST_ADDR}
      PLEX_TOKEN: ${HOMEPAGE_VAR_PLEX_TOKEN}
      RADARR_KEY: ${HOMEPAGE_VAR_RADARR_KEY}
      SONARR_KEY: ${HOMEPAGE_VAR_SONARR_KEY}
      LIDARR_KEY: ${HOMEPAGE_VAR_LIDARR_KEY}
      PROWLARR_KEY: ${HOMEPAGE_VAR_PROWLARR_KEY}
      SEERR_KEY: ${HOMEPAGE_VAR_SEERR_KEY}
    volumes:
      - ${DATA_ROOT}/dashboard:/host:ro
      - ${HOME}/backups/media-stack:/backups:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Up/down checks with history and phone alerts.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports: ["3001:3001"]
    volumes:
      - ${DATA_ROOT}/uptime-kuma:/app/data

# Fixed subnet so qBittorrent's "no login from the stack" rule and gluetun's firewall rule work on any machine.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
