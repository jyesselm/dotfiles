# ======================
# Prefix Key: Ctrl+Space
# ======================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ======================
# General Settings
# ======================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on                    # Enable mouse support
set -g base-index 1                # Start windows at 1, not 0
setw -g pane-base-index 1          # Start panes at 1
set -g renumber-windows on         # Renumber windows when one is closed
set -g history-limit 50000         # Scrollback buffer (10k was too low)
set -g escape-time 0               # No delay for escape key
set -g allow-passthrough on        # Allow clipboard passthrough
set -g focus-events on             # Enable focus events (needed for vim autoread)
set -g display-panes-time 2000     # Show pane numbers for 2 seconds
set -g display-time 2000           # Show messages for 2 seconds

# ======================
# Colorful pane borders
# ======================
set -g pane-border-status bottom
set -g pane-border-format '#{?pane_active,#[fg=#181825 bg=#89dceb bold] ▶ ACTIVE #P · #{=/28/...:pane_title} #[default],#[fg=#7f849c] #P · #{pane_current_command} }'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89dceb'
set -g pane-border-lines heavy
set -g pane-border-indicators both
# Keep text colors; use background contrast to reinforce pane focus.
setw -g window-style 'bg=#181825'
setw -g window-active-style 'bg=#242438'

# ======================
# Clipboard (works over SSH via OSC 52)
# ======================
set -g set-clipboard on
setw -g mode-keys vi               # Use vim keys in copy mode

# OSC 52 copy command - works over SSH! Terminal intercepts and copies locally
# Falls back to pbcopy/xclip when not over SSH
COPY_CMD="sh -c 'if [ -n \"$SSH_TTY\" ]; then printf \"\\033]52;c;%s\\a\" \"$(base64 | tr -d \"\\n\")\" > /dev/tty; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; fi'"

# Enter copy mode: prefix + v (or prefix + [)
bind v copy-mode
# Select with v, yank with y
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$COPY_CMD"

# Mouse selection copies to system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$COPY_CMD"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "$COPY_CMD"

# Double-click to copy word
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "$COPY_CMD"
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "$COPY_CMD"

# Paste: use tmux buffer (prefix + p) - for SSH, use your terminal's paste
bind p paste-buffer

# ======================
# Easy Window/Pane Creation
# ======================
bind c new-window -c "#{pane_current_path}"      # New window in current dir
bind \\ split-window -h -c "#{pane_current_path}" # Split vertical
bind - split-window -v -c "#{pane_current_path}" # Split horizontal
bind e new-window -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}"  # 3 stacked rows
bind E new-window -c "#{pane_current_path}" \; split-window -h -p 50 -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}"  # left | right-top/bottom

# ======================
# Pane Resizing (Vim-style with prefix + arrow keys)
# ======================
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ======================
# Window Reordering
# ======================
bind -r < swap-window -t -1 \; select-window -t -1  # Move window left
bind -r > swap-window -t +1 \; select-window -t +1  # Move window right

# ======================
# Navigation (Vim-style)
# ======================
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Smart pane switching with vim-tmux-navigator
# Ctrl+h/j/k/l works in both neovim and tmux
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Quick pane switch
bind -n C-\\ select-pane -t +       # Ctrl+\ = cycle panes (no prefix)
bind 1 select-pane -t 1             # prefix+1 = pane 1 (claude-code)
bind 2 select-pane -t 2             # prefix+2 = pane 2 (terminal)
bind 3 select-pane -t 3             # prefix+3 = pane 3 (pymol)

# ======================
# Session Management
# ======================
bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind s choose-tree -sZ                # Session picker (interactive)
bind w choose-tree -wZ                # Window picker (interactive)
bind R command-prompt -p "Rename session:" "rename-session '%%'"

# ======================
# Quick Session Switching
# ======================
bind ( switch-client -p              # Previous session
bind ) switch-client -n              # Next session
bind Tab switch-client -l            # Toggle last session (huge time-saver)

# Prefix-free session navigation (left Option sends Esc+ in iTerm2).
bind -n M-Tab switch-client -l
bind -n M-p switch-client -p
bind -n M-n switch-client -n
bind -n M-s choose-tree -sZ
# Stable direct jumps to the two main sessions.
bind -n M-w switch-client -t '=work'
bind -n M-r switch-client -t '=remotes'
# Keep session tabs clickable, as well as the regular window tabs.
bind -n MouseDown1Status switch-client -t =

# ======================
# Fuzzy Session Finder (fzf popup)
# ======================
# prefix + f = fuzzy switch to any session or window
bind f display-popup -E -w 60% -h 60% "\
  (tmux list-sessions -F '[session] #S (#{session_windows} wins)'; \
   tmux list-windows -a -F '[window] #S:#I #W') | \
  fzf --reverse --header='Switch Session/Window' --preview='tmux capture-pane -ep -t {2}' --preview-window=right:50% | \
  awk '{print \$2}' | \
  xargs -I{} tmux switch-client -t {}"

# prefix + F = create new session from project directory
bind F display-popup -E -w 60% -h 60% "\
  find ~/projects ~/repos ~/code -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | \
  fzf --reverse --header='New Session from Project' | \
  xargs -I{} sh -c 'name=\$(basename {}); tmux new-session -ds \"\$name\" -c {} 2>/dev/null; tmux switch-client -t \"\$name\"'"

# prefix + g = kill sessions interactively (multi-select with Tab)
bind g display-popup -E -w 60% -h 60% "\
  tmux list-sessions -F '#S (#{session_windows} wins)' | \
  fzf --reverse --multi --header='Kill Sessions (Tab to select multiple)' | \
  awk '{print \$1}' | \
  xargs -I{} tmux kill-session -t {}"

# Yazi runs in its own window; q closes it and returns to your work.
bind y new-window -n files -c "#{pane_current_path}" "exec yazi"
# Image previews need the terminal identity available to new windows.
set -ga update-environment ' TERM TERM_PROGRAM'

# Shortcut reference fallback; which-key overrides ? when TPM loads.
bind ? display-popup -E -w 88% -h 85% -T ' tmux shortcuts · q closes ' "less -R ~/.config/tmux/shortcuts.txt"
bind B list-keys

# ======================
# Reload Config
# ======================
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ======================
# Colorful status: windows + clickable sessions
# ======================
set -g status-position bottom
set -g status-interval 5
# Prefix feedback is limited to the red label in the session row.
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left-length 35
set -g status-left ''
set -g status-right-length 32
# Compact hints and clock; TPM/Continuum appends its autosave hook below.
set -g status-right '#{?window_zoomed_flag,#[fg=#fab387 bold] ZOOM ,}#{?#{e|>=:#{client_width},70},#[fg=#a6adc8 nobold] ? menu  ,}#[fg=#a6e3a1 nobold] %H:%M '
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#a6adc8 bg=default nobold] #I #{=/22/...:window_name} '
setw -g window-status-current-format '#[fg=#181825 bg=#fab387 bold] #I #{=/22/...:window_name}#{?window_zoomed_flag, +,} '
setw -g window-status-activity-style 'fg=#f9e2af,bg=#313244'
setw -g window-status-bell-style 'fg=#181825,bg=#f38ba8,bold'

# Session colors follow stable server session IDs; eight Catppuccin colors repeat.
# Bottom status block: session tabs followed by window tabs.
set -g status-format[0] '#[align=left]#{?client_prefix,#[fg=#f38ba8 bold] PREFIX #[default] ,#[fg=#7f849c] sessions #[default] }#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{S/n:#[range=session|#{session_id} fg=#{?#{==:#{e|m:#{s/\$//:session_id},8},0},#94e2d5,#{?#{==:#{e|m:#{s/\$//:session_id},8},1},#cba6f7,#{?#{==:#{e|m:#{s/\$//:session_id},8},2},#fab387,#{?#{==:#{e|m:#{s/\$//:session_id},8},3},#89b4fa,#{?#{==:#{e|m:#{s/\$//:session_id},8},4},#f9e2af,#{?#{==:#{e|m:#{s/\$//:session_id},8},5},#f5c2e7,#{?#{==:#{e|m:#{s/\$//:session_id},8},6},#a6e3a1,#b4befe}}}}}}} bg=default nobold] #S #[norange default list=on] ,#[range=session|#{session_id} list=focus fg=#181825 bg=#{?#{==:#{e|m:#{s/\$//:session_id},8},0},#94e2d5,#{?#{==:#{e|m:#{s/\$//:session_id},8},1},#cba6f7,#{?#{==:#{e|m:#{s/\$//:session_id},8},2},#fab387,#{?#{==:#{e|m:#{s/\$//:session_id},8},3},#89b4fa,#{?#{==:#{e|m:#{s/\$//:session_id},8},4},#f9e2af,#{?#{==:#{e|m:#{s/\$//:session_id},8},5},#f5c2e7,#{?#{==:#{e|m:#{s/\$//:session_id},8},6},#a6e3a1,#b4befe}}}}}}} bold] ● #S #[norange default list=on] }#[nolist norange default align=right]#{?#{e|>=:#{client_width},110},#[fg=#a6adc8] #{=/18/...:#{?HOSTNAME_ALIAS,#{HOSTNAME_ALIAS},#{host_short}}}  ,}#{?#{e|>=:#{client_width},75},#[fg=#89dceb]P#P #{=/12/...:pane_current_command} #[fg=#585b70]· #[fg=#f9e2af]#{=/26/...:#{b:pane_current_path}} ,}'
set -g status-format[1] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
# Keep both session and window rows visible.
set -g status 2
set -g message-style 'fg=#181825,bg=#cba6f7,bold'
set -g message-command-style 'fg=#181825,bg=#f9e2af,bold'
setw -g mode-style 'fg=#181825,bg=#89dceb,bold'
set -g display-panes-colour '#cba6f7'
set -g display-panes-active-colour '#fab387'
set -g popup-style 'fg=#cdd6f4,bg=#1e1e2e'
set -g popup-border-style 'fg=#cba6f7'
set -g popup-border-lines rounded

# ======================
# Plugins (via TPM)
# ======================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # Save/restore sessions
set -g @plugin 'alexwforsythe/tmux-which-key' # Action menu on leader+?
set -g @plugin 'tmux-plugins/tmux-continuum'   # Auto save/restore sessions

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# Continuum settings
set -g @continuum-restore 'on'                 # Auto-restore on tmux start
set -g @continuum-save-interval '15'           # Auto-save every 15 minutes

# A bare tmux launch starts in work after the first automatic restore.
# Consume the server marker so later manual restores keep normal behavior.
set -g @resurrect-hook-post-restore-all 'if [ "$(tmux show-environment -g TMUX_DEFAULT_STARTUP 2>/dev/null)" = "TMUX_DEFAULT_STARTUP=work" ]; then tmux set-environment -gu TMUX_DEFAULT_STARTUP; tmux has-session -t =work 2>/dev/null && tmux switch-client -t =work; fi'

# Keep the yadm-managed menu authoritative on every computer.
set -g @tmux-which-key-disable-autobuild 1
run-shell '~/.config/tmux/sync-which-key.sh'

# Initialize TPM last. Bootstrap installs it on a new machine.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
